trigger: none

pr: none

pool:
  name: 'SRE-Demo'
  demands:
    - Agent.Name -equals sre-demo-vm

stages:

# ============================================================
# BUILD
# ============================================================
- stage: Build
  displayName: 'Build Application'

  jobs:
  - job: Build
    displayName: 'Build .NET Framework Application'

    steps:
    - checkout: self

    - task: NuGetToolInstaller@1
      displayName: 'Install NuGet'

    - task: NuGetCommand@2
      displayName: 'Restore NuGet Packages'
      inputs:
        restoreSolution: '**/*.sln'

    - task: VSBuild@1
      displayName: 'Build ASP.NET MVC Application'
      inputs:
        solution: '**/*.sln'
        configuration: 'Release'
        msbuildArgs: '/p:DeployOnBuild=true /p:WebPublishMethod=Package /p:PackageAsSingleFile=true /p:SkipInvalidConfigurations=true'

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Application Artifact'
      inputs:
        PathtoPublish: '$(Build.SourcesDirectory)/AzureSreAgentDemo/AzureSreAgentDemo/obj/Release/Package'
        ArtifactName: 'drop'
        publishLocation: 'Container'


# ============================================================
# DEPLOY DEV
# main -> DEV
# ============================================================
- stage: Deploy_DEV
  displayName: 'Deploy to DEV'
  dependsOn: Build

  condition: "and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))"

  jobs:
  - job: DeployDEV
    displayName: 'Deploy Application to IIS DEV'

    steps:
    - download: current
      artifact: drop

    - powershell: |
        Import-Module WebAdministration

        Write-Host "Stopping DEV application pool..."
        Stop-WebAppPool -Name "AzureSreAgentDemo-DEV" -ErrorAction SilentlyContinue

        Write-Host "Cleaning DEV deployment folder..."
        Remove-Item "C:\inetpub\AzureSreAgentDemo\DEV\*" -Recurse -Force -ErrorAction SilentlyContinue

        Write-Host "Copying application files..."
        Copy-Item "$(Pipeline.Workspace)\drop\PackageTmp\*" `
                  "C:\inetpub\AzureSreAgentDemo\DEV" `
                  -Recurse -Force

        Write-Host "Waiting for IIS application pool to stop..."
        Start-Sleep -Seconds 10

        Write-Host "Starting DEV application pool..."
        Start-WebAppPool -Name "AzureSreAgentDemo-DEV"

        Write-Host "DEV deployment completed."
      displayName: 'Deploy to IIS DEV'


# ============================================================
# DEPLOY QA
# develop -> QA
# ============================================================
- stage: Deploy_QA
  displayName: 'Deploy to QA'
  dependsOn: Build

  condition: "and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/develop'))"

  jobs:
  - job: DeployQA
    displayName: 'Deploy Application to IIS QA'

    steps:
    - download: current
      artifact: drop

    - powershell: |
        Import-Module WebAdministration

        Write-Host "Stopping QA application pool..."
        Stop-WebAppPool -Name "AzureSreAgentDemo-QA" -ErrorAction SilentlyContinue

        Write-Host "Cleaning QA deployment folder..."
        Remove-Item "C:\inetpub\AzureSreAgentDemo\QA\*" -Recurse -Force -ErrorAction SilentlyContinue

        Write-Host "Copying application files..."
        Copy-Item "$(Pipeline.Workspace)\drop\PackageTmp\*" `
                  "C:\inetpub\AzureSreAgentDemo\QA" `
                  -Recurse -Force

        Write-Host "Waiting for IIS application pool to stop..."
        Start-Sleep -Seconds 10

        Write-Host "Starting QA application pool..."
        Start-WebAppPool -Name "AzureSreAgentDemo-QA"

        Write-Host "QA deployment completed."
      displayName: 'Deploy to IIS QA'


# ============================================================
# DEPLOY UAT
# Release -> UAT
# ============================================================
- stage: Deploy_UAT
  displayName: 'Deploy to UAT'
  dependsOn: Build

  condition: "and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/Release'))"

  jobs:
  - job: DeployUAT
    displayName: 'Deploy Application to IIS UAT'

    steps:
    - download: current
      artifact: drop

    - powershell: |
        Import-Module WebAdministration

        Write-Host "Stopping UAT application pool..."
        Stop-WebAppPool -Name "AzureSreAgentDemo-UAT" -ErrorAction SilentlyContinue

        Write-Host "Cleaning UAT deployment folder..."
        Remove-Item "C:\inetpub\AzureSreAgentDemo\UAT\*" -Recurse -Force -ErrorAction SilentlyContinue

        Write-Host "Copying application files..."
        Copy-Item "$(Pipeline.Workspace)\drop\PackageTmp\*" `
                  "C:\inetpub\AzureSreAgentDemo\UAT" `
                  -Recurse -Force

        Write-Host "Waiting for IIS application pool to stop..."
        Start-Sleep -Seconds 10

        Write-Host "Starting UAT application pool..."
        Start-WebAppPool -Name "AzureSreAgentDemo-UAT"

        Write-Host "UAT deployment completed."
      displayName: 'Deploy to IIS UAT'